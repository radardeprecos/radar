name: 🤖 ROBÔ SUPREMO (RADAR DE PREÇOS)
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 📦 Instalar Dependências
        run: pip install requests
      - name: 🤖 Execução do Scanner
        run: python scripts/scanner.py
      - name: 🚀 Publicação Automática (Git Push)
        run: |
          git config --global user.email "bot@radardeprecos.com"
          git config --global user.name "RoboSupremo-Radar"
          git add data/products/offers.json
          if [[ -n $(git status -s) ]]; then
            git commit -m "🤖 [ROBÔ SUPREMO] Atualização de Ofertas"
            git push origin main
          fi
      - name: 📂 Configurar Pages
        uses: actions/configure-pages@v4
      - name: 📂 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 🚀 Deploy para Pages
        uses: actions/deploy-pages@v4
        
