name: 🤖 ROBÔ SUPREMO (RADAR DE PREÇOS)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation:
    runs-on: ubuntu-latest
    environment: github-pages
    
    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm install

      - name: 🤖 Execução do Scanner
        run: node scripts/scanner.js

      - name: 🚀 Publicação Automática (Git Push)
        run: |
          git config --global user.email "bot@radardeprecos.com"
          git config --global user.name "RoboSupremo-Radar"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "🤖 [ROBÔ SUPREMO] Atualização de Ofertas"
            git push origin main
          else
            echo "ℹ️ Nenhuma mudança detectada."
          fi

      - name: 📂 Configurar Pages
        uses: actions/configure-pages@v4

      - name: 📂 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy para Pages
        uses: actions/deploy-pages@v4
