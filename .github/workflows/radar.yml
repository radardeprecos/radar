name: 🤖 Radar de Preços (ROBÔ SUPREMO - FASE 11)
on:
  push:
    branches:
      - fase-11-radar-pro
  schedule:
    - cron: '40 * * * *' # Rodar no minuto 40 para não conflitar com o Robô 1 (minuto 10)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4
        with:
          ref: fase-11-radar-pro
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 📦 Instalar Dependências
        run: pip install -r requirements.txt
        
      - name: 🤖 Execução do Pipeline
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFILIADO_ID: ${{ secrets.ML_AFILIADO_ID || 'vendas0nline' }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scripts
          python scripts/fetch_products.py
          python scripts/score_products.py
          python scripts/affiliate_links.py
          python scripts/validate_products.py
          python scripts/deduplicate.py
          python scripts/generate_pages.py
          python scripts/build_homepage.py
          python scripts/build_categories.py
          python scripts/generate_comparisons.py
          python scripts/generate_blog_posts.py
          python scripts/generate_product_intelligence.py
          python scripts/build_sitemap.py
          
      - name: 🚀 Publicação Automática (Git Push)
        run: |
          git config --global user.email "bot@radardeprecos.com"
          git config --global user.name "Radar-Bot-2"
          git add .
          if [[ -n $(git status -s) ]]; then
            git commit -m "🤖 [ROBÔ 2] Atualização de Ofertas e Páginas $(date +'%Y-%m-%d %H:%M')"
            git push origin fase-11-radar-pro
          fi
          
      - name: 📂 Configurar Pages
        uses: actions/configure-pages@v4
        
      - name: 📂 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
  deploy:
    runs-on: ubuntu-latest
    needs: automation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy para Pages
        id: deployment
        uses: actions/deploy-pages@v4
