name: 🤖 Radar de Preços (ROBÔ SUPREMO)
on:
  push:
    branches:
      - main
  schedule:
    - cron: '10 * * * *' # Executa a cada 1 hora (ajustado para evitar picos de tráfego)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 📦 Instalar Dependências
        run: pip install -r requirements.txt
      - name: 🤖 Execução do Pipeline
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFILIADO_ID: ${{ secrets.ML_AFILIADO_ID || 'vendas0nline' }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scripts
          
          # 1. Coleta e Processamento Base
          python scripts/fetch_products.py
          python scripts/score_products.py
          python scripts/affiliate_links.py
          python scripts/validate_products.py
          python scripts/deduplicate.py
          
          # 2. Sincronização com Banco de Dados
          python scripts/sync_database.py
          
          # 3. Geração de Inteligência (Fase 11)
          python scripts/generate_radar_index.py
          python scripts/generate_market_intelligence.py
          python scripts/generate_segmented_newsletter.py
          python scripts/editorial_automation.py
          
          # 4. Geração de Conteúdo e Páginas
          python scripts/generate_pages.py
          python scripts/build_homepage.py
          python scripts/build_categories.py
          python scripts/generate_comparisons.py
          python scripts/generate_blog_posts.py
          python scripts/generate_product_intelligence.py
          
          # 5. SEO e Auditoria
          python scripts/build_sitemap.py
          python scripts/validate_phase11_assets.py

      - name: 🚀 Publicação Automática (Git Push)
        run: |
          git config --global user.email "bot@radardeprecos.com"
          git config --global user.name "Radar-Bot"
          git add .
          if [[ -n $(git status -s) ]]; then
            git commit -m "🤖 [ROBÔ] Atualização de Ofertas e Inteligência $(date +'%Y-%m-%d %H:%M')"
            # Puxa mudanças remotas com rebase para evitar conflitos se houver novos commits
            git pull --rebase origin main
            # Tenta o push com lógica de retry simples
            for i in {1..3}; do
              git push origin main && break || (echo "Push falhou, tentando novamente em 5s..." && sleep 5)
            done
          fi
      - name: 📂 Configurar Pages
        uses: actions/configure-pages@v4
      - name: 📂 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    runs-on: ubuntu-latest
    needs: automation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy para Pages
        id: deployment
        uses: actions/deploy-pages@v4
