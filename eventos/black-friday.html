<!DOCTYPE html>

<html lang="pt-BR">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4896859041377751" crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-4896859041377751">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Radar de Preços Premium | Alertas Inteligentes de Ofertas</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
        .bf-hero { background: #000; color: #fff; padding: 60px 20px; text-align: center; border-radius: 0 0 40px 40px; }
        .countdown { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .count-item { background: #333; padding: 15px; border-radius: 12px; min-width: 80px; }
        .count-value { font-size: 28px; font-weight: 800; color: #14b8a6; }
        .bf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
    </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Radar de Preços",
      "item": "https://radardeprecos.github.io/radar/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Eventos",
      "item": "https://radardeprecos.github.io/radar/eventos/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "Black Friday",
      "item": "https://radardeprecos.github.io/radar/eventos/black-friday/"
    }
  ]
}
</script>
</head>
<body>
<header style="background: var(--primary); padding: 20px; color: white; text-align: center;">
    <h1 style="margin:0; font-size: 24px;">📡 Radar de Preços</h1>
    <p style="margin:5px 0 0; opacity: 0.9;">Onde a economia encontra a inteligência.</p>
</header>
<div class="bf-hero">
<h1 style="color: #14b8a6;">BLACK FRIDAY 2026</h1>
<p>O Radar está monitorando 24h por dia para você não cair na "Metade do Dobro".</p>
<div class="countdown" id="timer">



</div>
</div>
<main class="container">
<h2 style="margin-top: 40px;">🔥 Ofertas Antecipadas</h2>
<div class="bf-grid" id="bfOffers">
<!-- Dinâmico -->
</div>
</main>
<script>
        // Timer para 27 de Novembro de 2026
        const target = new Date('2026-11-27T00:00:00').getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        }, 1000);

        fetch('../data/database/all_products.json').then(r=>r.json()).then(data => {
            const top = data.slice(0, 6);
            document.getElementById('bfOffers').innerHTML = top.map(p => `
                <div class="product-card">
                    <img src="${p.image}" style="width:100%; height:180px; object-fit:contain;" width="400" height="400" >
                    <h3>${p.name}</h3>
                    <div class="price">R$ ${p.price}</div>
                    <a href="${p.permalink}" class="buy-btn">VER PREÇO BF</a>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
