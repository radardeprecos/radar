<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Black Friday 2026 | Radar de Preços</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
        .bf-hero { background: #000; color: #fff; padding: 60px 20px; text-align: center; border-radius: 0 0 40px 40px; }
        .countdown { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .count-item { background: #333; padding: 15px; border-radius: 12px; min-width: 80px; }
        .count-value { font-size: 28px; font-weight: 800; color: #14b8a6; }
        .bf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
    </style>
</head>
<body>
<header class="header"><div class="container"><a class="logo" href="../">📊 Radar de Preços</a></div></header>
<div class="bf-hero">
<h1 style="color: #14b8a6;">BLACK FRIDAY 2026</h1>
<p>O Radar está monitorando 24h por dia para você não cair na "Metade do Dobro".</p>
<div class="countdown" id="timer">



</div>
</div>
<main class="container">
<h2 style="margin-top: 40px;">🔥 Ofertas Antecipadas</h2>
<div class="bf-grid" id="bfOffers">
<!-- Dinâmico -->
</div>
</main>
<script>
        // Timer para 27 de Novembro de 2026
        const target = new Date('2026-11-27T00:00:00').getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        }, 1000);

        fetch('../data/database/all_products.json').then(r=>r.json()).then(data => {
            const top = data.slice(0, 6);
            document.getElementById('bfOffers').innerHTML = top.map(p => `
                <div class="product-card">
                    <img src="${p.image}" style="width:100%; height:180px; object-fit:contain;">
                    <h3>${p.name}</h3>
                    <div class="price">R$ ${p.price}</div>
                    <a href="${p.permalink}" class="buy-btn">VER PREÇO BF</a>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
