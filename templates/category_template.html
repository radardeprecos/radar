<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Radar de Preços Premium | Alertas Inteligentes de Ofertas</title>
<meta content="{{meta.description}}" name="description"/>
<link href="../../assets/css/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<header style="background: var(--primary); padding: 20px; color: white; text-align: center;">
    <h1 style="margin:0; font-size: 24px;">📡 Radar de Preços</h1>
    <p style="margin:5px 0 0; opacity: 0.9;">Onde a economia encontra a inteligência.</p>
</header>
<div class="container" style="padding: 40px 20px;">
<h1 style="font-size: 32px; font-weight: 800; margin-bottom: 10px;">{{category.name}}</h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px;">
        {{category.products}}
    </div>
<p style="color: #666; margin-bottom: 40px;">Confira as melhores ofertas monitoradas em {{category.name}}.</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px;">
        {{category.products}}
    </div>

</div>
<footer class="footer">
<div class="container">
<div style="text-align: center; font-size: 14px; color: #888;">
                © 2026 Radar de Preços.
            </div>
</div>
</footer>
</body>
</html>
