<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Preços — Ofertas reais do Mercado Livre</title>
  <meta name="description" content="Monitoramos ofertas reais do Mercado Livre com desconto mínimo de 15%. Atualização automática a cada 20 minutos.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="./" class="logo">📊 <strong>Radar de Preços</strong></a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar ofertas...">
      </div>
      <button id="themeToggle">🌙</button>
    </div>
  </header>
  <nav class="cat-nav">
    <div class="container cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="todos">Todos</button>
      <a href="categorias/celulares/index.html" class="cat-tab">Celulares</a>
      <a href="categorias/informatica/index.html" class="cat-tab">Informática</a>
      <a href="categorias/eletrodomesticos/index.html" class="cat-tab">Eletrodomésticos</a>
      <a href="categorias/games/index.html" class="cat-tab">Games</a>
      <a href="categorias/tv-e-video/index.html" class="cat-tab">TV e Vídeo</a>
      <a href="categorias/ferramentas/index.html" class="cat-tab">Ferramentas</a>
      <a href="categorias/beleza/index.html" class="cat-tab">Beleza</a>
      <a href="categorias/casa/index.html" class="cat-tab">Casa</a>
    </div>
  </nav>
  <main class="container">
    <section class="hero" id="heroProduct">
      {{hero_section}}
    </section>
    <section class="section">
      <h2>🔥 Melhores Ofertas</h2>
      <div class="products-grid" id="featuredGrid">{{featured_products_grid}}</div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>© 2026 Radar de Preços. Atualizado via API oficial do Mercado Livre.</p>
      <div class="footer-links">
        <a href="/sobre/">Sobre</a>
        <a href="/contato/">Contato</a>
        <a href="/privacidade/">Privacidade</a>
        <a href="/termos/">Termos</a>
        <a href="/quem-somos/">Quem Somos</a>
      </div>
    </div>
  </footer>
  <script src="assets/js/app.js"></script>
</body>
</html>
