<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Preços — Ofertas reais do Mercado Livre</title>
  <meta name="description" content="Monitoramos ofertas reais do Mercado Livre com desconto mínimo de 15%. Atualização automática a cada 20 minutos.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="./" class="logo">📊 <strong>Radar de Preços</strong></a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar ofertas...">
      </div>
      <button id="themeToggle">🌙</button>
    </div>
  </header>

  <nav class="cat-nav">
    <div class="container cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="todos">Todos</button>
      <button class="cat-tab" data-cat="Celulares">Celulares</button>
      <button class="cat-tab" data-cat="Informática">Informática</button>
      <button class="cat-tab" data-cat="Eletrodomésticos">Eletrodomésticos</button>
      <button class="cat-tab" data-cat="Games">Games</button>
    </div>
  </nav>

  <main class="container">
    <section class="hero" id="heroProduct">
      <!-- Carregado via JS -->
      <div class="loading">Carregando ofertas...</div>
    </section>

    <section class="section">
      <h2>🔥 Melhores Ofertas</h2>
      <div class="products-grid" id="featuredGrid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Radar de Preços. Atualizado via API oficial do Mercado Livre.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
