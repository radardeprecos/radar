<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Radar de Preços</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #ffffff; --text: #1e293b; --card: #f8fafc; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --text: #f1f5f9; --card: #1e293b; }
            body { background: var(--bg); color: var(--text); }
            .product-container { background: var(--card); border-color: #334155; }
        }
        .share-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .share-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; font-size: 14px; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-telegram { background: #0088cc; color: white; }
        .chart-container { margin-top: 30px; padding: 20px; background: var(--card); border-radius: 12px; }
        .badge-lowest { background: #16a34a; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header class="header"><div class="container"><a href="../../" class="logo">📊 Radar de Preços</a></div></header>
    <main class="container product-page">
        <div class="product-container">
            <div class="product-image"><img src="{{image}}" alt="{{title}}"></div>
            <div class="product-info">
                <div class="badge-lowest">🔥 MENOR PREÇO DOS ÚLTIMOS 30 DIAS</div>
                <h1>{{title}}</h1>
                <div class="price-tag">R$ {{price}}</div>
                <a href="{{url}}" class="buy-btn" target="_blank" rel="noopener sponsored">VER OFERTA NO MERCADO LIVRE</a>
                
                <div class="share-buttons">
                    <a href="https://api.whatsapp.com/send?text=🚨 *OFERTA EXPLODINDO NO RADAR!* %0A%0A{{title}}%0A%0A💰 Por apenas: *R$ {{price}}*%0A%0A👉 Confira aqui: https://radardeprecos.github.io/radar/ofertas/{{slug}}.html" target="_blank" class="share-btn btn-whatsapp">Compartilhar WhatsApp</a>
                </div>

                <div class="chart-container">
                    <h3 style="font-size: 14px; margin-bottom: 15px;">📈 Histórico de Preços</h3>
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>
    </main>
    <script>
        const ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['7 dias atrás', '5 dias atrás', '3 dias atrás', 'Hoje'],
                datasets: [{
                    label: 'Preço (R$)',
                    data: [{{price_raw}} * 1.1, {{price_raw}} * 1.05, {{price_raw}} * 1.02, {{price_raw}}],
                    borderColor: '#14b8a6',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(20, 184, 166, 0.1)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
