<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Radar de Preços</title>
    <meta name="description" content="Oferta de {{title}} por apenas R$ {{price}}. Confira no Radar de Preços.">
    
    <!-- OpenGraph -->
    <meta property="og:title" content="{{title}} | Radar de Preços">
    <meta property="og:description" content="Aproveite esta oferta exclusiva do Mercado Livre monitorada pelo Radar.">
    <meta property="og:image" content="{{image}}">
    <meta property="og:type" content="product">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="../../assets/css/style.css">
    
    <!-- SEO: JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "{{title}}",
      "image": ["{{image}}"],
      "description": "Oferta monitorada pelo Radar de Preços no Mercado Livre.",
      "brand": { "@type": "Brand", "name": "Mercado Livre" },
      "offers": {
        "@type": "Offer",
        "url": "{{url}}",
        "priceCurrency": "BRL",
        "price": "{{price_raw}}",
        "availability": "https://schema.org/InStock",
        "seller": { "@type": "Organization", "name": "Mercado Livre" }
      }
    }
    </script>
</head>
<body>
    <header class="header"><div class="container"><a href="../../" class="logo">📊 Radar de Preços</a></div></header>
    <main class="container product-page">
        <div class="product-container">
            <div class="product-image"><img src="{{image}}" alt="{{title}}"></div>
            <div class="product-info">
                <h1>{{title}}</h1>
                <div class="price-tag">R$ {{price}}</div>
                {% if discount > 0 %}<div class="discount-badge">-{{discount}}% OFF</div>{% endif %}
                <p class="product-desc">Oferta verificada e monitorada pela nossa inteligência de mercado. Preço sujeito a alteração.</p>
                <a href="{{url}}" class="buy-btn" target="_blank" rel="noopener sponsored">VER OFERTA NO MERCADO LIVRE</a>
            </div>
        </div>
    </main>
</body>
</html>
