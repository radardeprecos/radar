<!DOCTYPE html>

<html lang="pt-BR">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4896859041377751" crossorigin="anonymous"></script>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Radar de Preços Premium | Alertas Inteligentes de Ofertas</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
        .sim-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #64748b; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; }
        .result-box { background: #f0fdf4; border: 1px solid #16a34a; padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px; display: none; }
        .result-value { font-size: 32px; font-weight: 800; color: #16a34a; }
    </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Radar de Preços",
      "item": "https://radardeprecos.github.io/radar/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Ferramentas",
      "item": "https://radardeprecos.github.io/radar/ferramentas/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "Simulador",
      "item": "https://radardeprecos.github.io/radar/ferramentas/simulador/"
    }
  ]
}
</script>
</head>
<body>
<header style="background: var(--primary); padding: 20px; color: white; text-align: center;">
    <h1 style="margin:0; font-size: 24px;">📡 Radar de Preços</h1>
    <p style="margin:5px 0 0; opacity: 0.9;">Onde a economia encontra a inteligência.</p>
</header>
<main class="container">
<div style="margin-top: 40px; text-align: center;">
<h1>💰 Simulador de Economia</h1>
<p style="color: #64748b;">Descubra quanto você está deixando de economizar por não usar o Radar.</p>
</div>

</main>
<script>
        function calculate() {
            const spend = document.getElementById('monthlySpend').value;
            if (!spend) return;
            const annualSavings = spend * 12 * 0.22; // Média de 22% de economia com Radar
            document.getElementById('savingsValue').innerText = 'R$ ' + annualSavings.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
