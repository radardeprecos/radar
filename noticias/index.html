<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias & Cupons | Radar de Preços</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .search-container { margin: 20px 0; position: relative; }
        .search-input { width: 100%; padding: 15px 20px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .search-input:focus { border-color: #14b8a6; }
        .filter-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .filter-tab { padding: 10px 20px; border-radius: 20px; background: #f1f5f9; cursor: pointer; white-space: nowrap; transition: all 0.3s; border: none; font-weight: 600; color: #64748b; }
        .filter-tab.active { background: #14b8a6; color: white; }
        .news-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .news-item { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; transition: transform 0.3s; }
        .news-item:hover { transform: translateY(-5px); border-color: #14b8a6; }
        .coupon-card { background: #f0fdf4; border: 2px dashed #16a34a; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .copy-btn { background: #16a34a; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header class="header"><div class="container"><a href="../" class="logo">📊 Radar de Preços</a></div></header>
    
    <main class="container" style="padding: 20px;">
        <h1 style="margin-bottom: 10px;">Notícias & Cupons</h1>
        <p style="color: #64748b; margin-bottom: 30px;">Tudo o que você precisa saber para economizar no Mercado Livre.</p>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar notícias ou cupons...">
        </div>

        <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-filter="all">📂 Todas</button>
            <button class="filter-tab" data-filter="lancamento">🚀 Lançamentos</button>
            <button class="filter-tab" data-filter="promocao">💰 Promoções</button>
            <button class="filter-tab" data-filter="cupom">🎟️ Cupons</button>
            <button class="filter-tab" data-filter="evento">🎉 Eventos</button>
        </div>

        <div id="newsContent" class="news-grid">
            <!-- Conteúdo dinâmico aqui -->
        </div>
    </main>

    <script>
        const DATA = [
            { type: 'cupom', code: 'RADAR10', desc: '10% extra em eletrônicos no Mercado Livre', filter: 'cupom' },
            { type: 'cupom', code: 'TECH20', desc: 'R0 off em compras acima de R00', filter: 'cupom' },
            { type: 'noticia', tag: 'lancamento', title: 'Samsung Galaxy A17 5G: O novo rei do custo-benefício?', excerpt: 'Analisamos o novo lançamento da Samsung que promete dominar o mercado intermediário em 2026.', url: 'posts/samsung-galaxy-a17-5g-lancamento.html', filter: 'lancamento' },
            { type: 'noticia', tag: 'promocao', title: 'Amazon Prime Day 2026: O que esperar das ofertas no Brasil', excerpt: 'As datas foram confirmadas! Veja como se preparar para o maior evento de compras do ano.', url: 'posts/amazon-prime-day-2026.html', filter: 'promocao' },
            { type: 'noticia', tag: 'evento', title: 'Black Friday 2026: Guia Definitivo de Sobrevivência', excerpt: 'Não caia em falsas promoções. Aprenda a usar o Radar para garantir descontos reais.', url: 'posts/como-economizar-eletronicos-2026.html', filter: 'evento' }
        ];

        function render(filter = 'all', search = '') {
            const container = document.getElementById('newsContent');
            const filtered = DATA.filter(item => {
                const matchesFilter = filter === 'all' || item.filter === filter;
                const matchesSearch = (item.title || item.code || '').toLowerCase().includes(search.toLowerCase()) || 
                                     (item.excerpt || item.desc || '').toLowerCase().includes(search.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            container.innerHTML = filtered.map(item => {
                if (item.type === 'cupom') {
                    return `
                        <div class="coupon-card">
                            <div style="font-weight: 800; color: #16a34a; font-size: 20px; margin-bottom: 5px;">${item.code}</div>
                            <p style="margin-bottom: 10px; color: #166534;">${item.desc}</p>
                            <button class="copy-btn" onclick="copyText('${item.code}')">Copiar Código</button>
                        </div>
                    `;
                } else {
                    return `
                        <a href="${item.url}" style="text-decoration: none; color: inherit;">
                            <div class="news-item">
                                <span class="news-tag" style="background: #e2e8f0; padding: 4px 10px; border-radius: 4px; font-size: 12px;">${item.tag.toUpperCase()}</span>
                                <h3 style="margin: 10px 0;">${item.title}</h3>
                                <p style="color: #64748b; font-size: 14px;">${item.excerpt}</p>
                            </div>
                        </a>
                    `;
                }
            }).join('') || '<p style="text-align:center; padding: 40px; color: #64748b;">Nenhum resultado encontrado.</p>';
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('Cupom ' + text + ' copiado!');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeFilter = document.querySelector('.filter-tab.active').dataset.filter;
            render(activeFilter, e.target.value);
        });

        document.getElementById('filterTabs').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-tab')) {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                render(e.target.dataset.filter, document.getElementById('searchInput').value);
            }
        });

        render();
    </script>
</body>
</html>
